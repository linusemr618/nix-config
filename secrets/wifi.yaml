# WiFi passwords configuration
# This file should be encrypted with SOPS
# 
# To encrypt this file after adding your WiFi passwords:
#   nix run nixpkgs#sops -- -e -i secrets/wifi.yaml
#
# To edit this file:
#   nix run nixpkgs#sops -- secrets/wifi.yaml
#
# Add your WiFi network passwords below:
# wifi_networks:
#   home_network: "your-wifi-password-here"
#   work_network: "another-password-here"

wifi_networks:
  example_network: "REPLACE_WITH_YOUR_PASSWORD"
